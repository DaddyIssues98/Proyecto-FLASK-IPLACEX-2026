{% extends "base.html" %}
{% block title %}Ejercicio 1 - Notas{% endblock %}

{% block content %}
    <div class="card">
        <h2>Formulario de Notas</h2>
        <form method="POST" action="{{ url_for('ejercicio1') }}">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" name="nota1" min="10" max="70" required oninvalid="this.setCustomValidity('La nota debe estar entre 10 y 70')" oninput="this.setCustomValidity('')">

            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" name="nota2" min="10" max="70" required oninvalid="this.setCustomValidity('La nota debe estar entre 10 y 70')" oninput="this.setCustomValidity('')">

            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" name="nota3" min="10" max="70" required oninvalid="this.setCustomValidity('La nota debe estar entre 10 y 70')" oninput="this.setCustomValidity('')">

            <label for="asistencia">Asistencia (%):</label>
            <input type="number" id="asistencia" name="asistencia" min="0" max="100" required oninvalid="this.setCustomValidity('La asistencia debe estar entre 0 y 100')" oninput="this.setCustomValidity('')">

            <button type="submit" class="btn-submit">Enviar</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="{{ url_for('index') }}" class="btn-volver">Volver al Menú Principal</a>
        </div>

        {% if promedio is defined %}
        <div class="resultado">
            <p>{{ promedio }}</p>
            <p>{{ estado }}</p>
        </div>
        {% endif %}
    </div>
{% endblock %}
