<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Formulario de Notas</h2>
            <form method="POST" action="{{ url_for('ejercicio1') }}">
                <label for="nota1">Nota 1:</label>
                <input type="number" id="nota1" name="nota1" min="10" max="70" required>

                <label for="nota2">Nota 2:</label>
                <input type="number" id="nota2" name="nota2" min="10" max="70" required>

                <label for="nota3">Nota 3:</label>
                <input type="number" id="nota3" name="nota3" min="10" max="70" required>

                <label for="asistencia">Asistencia (%):</label>
                <input type="number" id="asistencia" name="asistencia" min="0" max="100" required>

                <button type="submit" class="btn-submit">Enviar</button>
                <a href="{{ url_for('index') }}" class="btn-volver">Volver al Menú Principal</a>
            </form>

            {% if promedio is defined %}
            <div class="resultado">
                <p>{{ promedio }}</p>
                <p>{{ estado }}</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
