<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Nombres</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <div class="card" style="text-align: center;">
            <form method="POST" action="{{ url_for('ejercicio2') }}">
                <label for="nombre1">Nombre 1:</label>
                <input type="text" id="nombre1" name="nombre1" required>

                <label for="nombre2">Nombre 2:</label>
                <input type="text" id="nombre2" name="nombre2" required>

                <label for="nombre3">Nombre 3:</label>
                <input type="text" id="nombre3" name="nombre3" required>

                <button type="submit" class="btn-submit">Enviar</button>
                <a href="{{ url_for('index') }}" class="btn-volver">Volver al Menú Principal</a>
            </form>

            {% if nombre_mas_largo is defined %}
            <div class="resultado">
                <p>El nombre con mayor cantidad de caracteres es : {{ nombre_mas_largo }}</p>
                <p>El nombre tiene : {{ cantidad }} caracteres</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
